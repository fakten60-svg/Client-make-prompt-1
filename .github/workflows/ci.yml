name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # Fast feedback: the portable parts of the codebase (timestamp formatting, fixed
  # text buffers) are pure C++ and run in seconds on Linux. A broken log format or
  # buffer overflow is caught before the Windows runner even starts.
  host-tests:
    name: host tests (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWOKE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # The real artifact: x64 Release woke.dll plus the optional injector helper.
  build-windows:
    name: build (windows x64 release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DWOKE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run host tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: woke-windows-x64
          path: |
            bin/Release/woke.dll
            bin/Release/woke_injector.exe
          if-no-files-found: error
