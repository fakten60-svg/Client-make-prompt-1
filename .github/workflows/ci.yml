name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # Fast feedback: the portable parts of the codebase (timestamp formatting, fixed
  # text buffers) are pure C++ and run in seconds on Linux. A broken log format or
  # buffer overflow is caught before the Windows runner even starts.
  host-tests:
    name: host tests (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWOKE_BUILD_TESTS=ON -DWOKE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # §11 review gate, enforced mechanically: module code must never touch the game's network
      # layer. The client reads and writes client-side state only - no packet synthesis, no
      # traffic, no chat manipulation. This grep runs on every CI pass so the invariant cannot
      # erode one "temporary" call at a time.
      - name: Network-safety grep gate (§11)
        run: |
          if grep -rniE 'ClientConnection|sendPacket|PacketByteBufs|networkHandler' src/modules/; then
            echo '::error::module code references the network layer - §11 forbids packet synthesis'
            exit 1
          fi
          echo '§11 network-safety gate: clean'

  # The real artifact: x64 Release woke.dll plus the optional injector helper.
  build-windows:
    name: build (windows x64 release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The JVM bridge needs jni.h. Pinning the same JDK major that Minecraft 1.21.11 ships
      # with keeps the compile check aligned with the runtime we attach to, and makes
      # WOKE_REQUIRE_JNI=ON below deterministic instead of dependent on image contents.
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        shell: pwsh
        run: |
          # The windows-latest image changes its Visual Studio major version over time
          # (VS 2022 -> VS 2026), and a hard-coded -G stops working the day the image moves.
          # Detect the newest installed Visual Studio generator instead of assuming one.
          $generators = @()
          foreach ($line in (cmake --help)) {
            if ($line -match 'Visual Studio (\d+) (\d{4})') {
              $generators += [pscustomobject]@{
                Name  = "Visual Studio $($Matches[1]) $($Matches[2])"
                Major = [int]$Matches[1]
              }
            }
          }
          if ($generators.Count -eq 0) {
            cmake --help
            throw 'no Visual Studio generator is available on this runner'
          }
          $chosen = ($generators | Sort-Object Major -Descending | Select-Object -First 1).Name
          Write-Host "using generator: $chosen"
          # Warnings are errors for first-party targets only; vendored code is exempt by
          # construction because the warning policy is applied per first-party target.
          # WOKE_REQUIRE_JNI=ON makes a missing JDK fatal, so this job cannot go green with
          # roadmap step 2 quietly compiled out.
          cmake -B build -G $chosen -A x64 `
            -DWOKE_BUILD_TESTS=ON -DWOKE_WARNINGS_AS_ERRORS=ON -DWOKE_REQUIRE_JNI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run host tests
        run: ctest --test-dir build -C Release --output-on-failure

      # A silent skip would make the artifact look fine while a subsystem was never compiled,
      # so the built DLL is checked for markers that only those subsystems emit. This is how
      # "CI is green" means the JVM bridge, the hook engine and the overlay are in the artifact.
      - name: Verify the JVM bridge, hook engine and overlay are in the artifact
        shell: pwsh
        run: |
          $dll = 'bin/Release/woke.dll'
          if (-not (Test-Path $dll)) { throw "$dll was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $markers = @(
            'JNI_GetCreatedJavaVMs',   # step 2: the JVM bridge is compiled in
            'mappings: resolved',      # step 2: the registry reports its anchor tally
            'jvm-bridge',              # step 2: the boot step ran
            'wglSwapBuffers',          # step 3: the swap hook target
            'hook-manager',            # step 3: the MinHook wrapper is compiled in
            'frame-pipeline',          # step 3: the frame scheduler is compiled in
            'ui-theme',                # step 4: the theme table is compiled in
            'gui-renderer',            # step 4: the ImGui host is compiled in
            'chrome shown',            # step 4: the overlay lifecycle is compiled in
            'clickgui',                # step 4: the chrome composition is compiled in
            'modules: config loaded',  # step 5: the registry boot step is compiled in
            'configs/default.json',    # step 5: persistence is compiled in
            'Sprint State',            # step 5: the example modules are compiled in
            'Search modules...',       # step 6: the search field component is compiled in
            'RSHIFT',                  # step 6: the keybind chip's key-name table is compiled in
            'GENERAL',                 # step 6: the sidebar's navigation groups are compiled in
            'keybind: capturing',      # step 6: the chip's capture mode is wired to the GUI
            'notifications: pool full', # step 6: the toast pool is wired to the GUI
            'Fullbright',              # step 7: the Fullbright module is registered
            'Gamma option value',      # step 7: the gamma write seam is compiled in
            'Zoom magnification',      # step 7: the Zoom module is registered
            'How far ahead to predict',# step 7: the Trajectories module is registered
            'Custom Crosshair',        # step 7: the crosshair module is registered
            'Arraylist ordering',      # step 7: the HUD module is registered
            'Open or close the ClickGUI overlay.', # step 7: the Misc/ClickGUI module is present
            ' fps'                     # step 7: the in-world overlay renderer is compiled in
          )
          foreach ($marker in $markers) {
            if (-not $text.Contains($marker)) { throw "woke.dll is missing the marker '$marker'" }
          }
          Write-Host 'JVM bridge and hook engine markers are present in woke.dll'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: woke-windows-x64
          path: |
            bin/Release/woke.dll
            bin/Release/woke_injector.exe
          if-no-files-found: error

  # A tag on main is a release: the same verified artifact is attached to a GitHub
  # Release. The push run that carries the tag re-runs the build (so the attached DLL
  # is exactly what CI verified, not a re-download), then publishes the Release. The
  # workflow_dispatch trigger keeps the publish path exercised outside of tags too.
  release:
    name: release (windows x64 dll)
    needs: [host-tests, build-windows]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: woke-windows-x64
          path: dist

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -f dist/woke.dll
          test -f dist/woke_injector.exe
          gh release create "$GITHUB_REF_NAME" \
            "dist/woke.dll#woke.dll (x64 Windows, release build)" \
            "dist/woke_injector.exe#woke_injector.exe (local testing loader)" \
            --verify-tag \
            --title "woke.wtf $GITHUB_REF_NAME" \
            --notes "Release build of woke.dll for Minecraft 1.21.11 Fabric (x64 Windows)."$'\n\n'"For private server testing and local singleplayer development only - see README.md for the scope guardrails, build instructions and usage."
